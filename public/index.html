<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <!-- Favicon -->
    <link rel="icon" href="%PUBLIC_URL%/logo.png" />

    <!-- Responsive design -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Browser theme -->
    <meta name="theme-color" content="#000000" />

    <!-- Primary SEO -->
    <title>
      Free Press Initiative Zambia | Press Freedom, Journalism & Media Literacy
    </title>

    <meta
      name="description"
      content="Free Press Initiative Zambia promotes press freedom, independent journalism, media and information literacy, investigative journalism, human rights, access to information and citizen participation in democratic governance."
    />

    <meta
      name="author"
      content="Free Press Initiative Zambia"
    />

    <meta
      name="keywords"
      content="Free Press Initiative Zambia, FPI Zambia, press freedom Zambia, journalism Zambia, independent journalism Zambia, media literacy Zambia, media and information literacy, investigative journalism Zambia, freedom of expression Zambia, access to information Zambia, journalist safety Zambia, democracy and media Zambia, human rights Zambia"
    />

    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <!-- Canonical URL -->
    <link
      rel="canonical"
      href="https://fpizambia.org/"
    />

    <!-- Open Graph / Facebook -->
    <meta
      property="og:title"
      content="Free Press Initiative Zambia | Press Freedom & Independent Journalism"
    />

    <meta
      property="og:description"
      content="Free Press Initiative Zambia promotes press freedom, independent journalism, media literacy, investigative journalism, human rights and access to information across Zambia."
    />

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:url"
      content="https://fpizambia.org/"
    />

    <meta
      property="og:site_name"
      content="Free Press Initiative Zambia"
    />

    <meta
      property="og:locale"
      content="en_ZM"
    />

    <meta
      property="og:image"
      content="%PUBLIC_URL%/logo.png"
    />

    <meta
      property="og:image:alt"
      content="Free Press Initiative Zambia"
    />

    <!-- Twitter / X -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Free Press Initiative Zambia | Press Freedom & Journalism"
    />

    <meta
      name="twitter:description"
      content="Promoting press freedom, independent journalism, media literacy, investigative journalism and access to information in Zambia."
    />

    <meta
      name="twitter:image"
      content="%PUBLIC_URL%/logo.png"
    />

    <meta
      name="twitter:image:alt"
      content="Free Press Initiative Zambia"
    />

    <!-- Apple -->
    <link
      rel="apple-touch-icon"
      href="%PUBLIC_URL%/logo.png"
    />

    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link
      rel="manifest"
      href="%PUBLIC_URL%/manifest.json"
    />

    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>

    <div id="root"></div>

    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
